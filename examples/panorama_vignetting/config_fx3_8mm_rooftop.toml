# Config of record: the 8 mm fisheye on the Sony FX3, the rooftop sweep (10 frames, 1/1600 s, f/5.6, ISO 100, every frame the
# same exposure; yaw −54° … +47°, pitch −5° … +27°). Every input path is relative to the data root $VGTK_DATA_ROOT (the
# author's: ~/data/rc-cvpr2027).
# Run: julia --project=<env> examples/panorama_vignetting/run.jl examples/panorama_vignetting/config_fx3_8mm_rooftop.toml

name = "fx3_8mm_rooftop"

[inputs]
raw_dir = "vignetting/data/sony_fisheye"           # the RAW frames (*.ARW), in capture order by name
raw_extension = ".ARW"
lens = "vignetting/data/ref_grid.json"             # a generic grid lens (vgio/generic_camera/v2, 105 × 75: a SplineLens camera)
lens_kind = "grid"                                 # read as a SplineLens camera; its forward spline fitted over its imaged region
spline_tolerance_px = 0.01                         # fit_camera(SplineLens, camera, imaged_region(camera); tolerance)
lens_camera = "none"                               # (a grid file holds one camera)
# The image circle is the camera's lens coverage, stored with the camera (PanoramaStitching 0.6 refuses a `circle` key here);
# a grid file's domain is its coverage. For this lens: Circle((2144.50, 1436.69), 1072.64), camera pixels, RC's registration
# record (vignetting/results/logs/registration/rotations.json, "circle").

[compute]
device = "cuda"                                    # "cuda" or "cpu": the same kernels (log V agrees to 1e-6)

[decode]
mode = "bin2"                                      # Features' load_raw: 2 × 2 Bayer quads (R, mean G, B); raw_frame_map x ↦ 2x
gain = 1.0                                         # linear values, 1.0 = the white level
cache = true                                       # the decoded-RAW cache (opt-in; JLD2 from the example's environment)

[registration]                                     # register_rotations (every keyword stated); the settings that worked on
tone_percentile = 99.5                             # the 14 mm set (2026-11-04)
detector_margin_px = 30.0
asift_tilts = "untilted"                           # Features' tilt_schedule ("untilted": the identity warp, its schedule for a panorama's views)
max_detections = 2048
selection = "spread"                               # Features' spread_strongest (SSC): about max_detections spread over the frame
detection_image = "tone"                           # "tone" (sqrt(G / p), tone_percentile) or "vst" (the RAW's variance-stabilized green; then
                                                   # noise_sigmas, the threshold, and sensor_characterisation, the body's vgio/sensor_characterisation file or "none")
descriptor = "b"
matcher = "b128"
min_score = 0.0
pairs = "all"
min_inliers = 25
seed = 1
outlier_halfwidth_px = 2120.0                      # StudentTUniformScoring on RotationProblem: the outlier half-width a (px; half the FX3's
                                                   # 4240 px long side), Jeffreys scale and flat label priors; from the hetero-cov
                                                   # validation, exact for these plain detections (ℓ ≡ 0)
local_optimization_strategy = { type = "irls", loss = "tls" }   # the pairs' RANSAC local optimization (Estimation's strategy table; Irls{TLSShape} its rotation default)
max_trials = 10000
min_trials = 100
averaging_optimization_strategy = { type = "irls", loss = "huber", max_iter = 100 }   # the view graph's averaging (Estimation's fit_rotation_averaging strategy of record)
cycle_tol_deg = 2.0                                # the view-graph filters (Estimation's fit_filtered_rotation_averaging): a pair off a 3-cycle by more
orientation_tol_deg = 5.0                          # than this removed, then a pair off the averaged rotations by more than this
bundle_optimization_strategy = { type = "triggs", loss = "welsch", efficiency_constant = 2.5 }   # the bundle: ONE LM run, Welsch at 2.5 × σ̂ (the pairs' pooled RANSAC scale, px)
bundle_max_iter = 1000                             # never the reason it stops here: rotations.json records the iterations it took
bundle_ftol = 1.0e-10                              # the relative cost decrease that stops it
bundle_xtol = 1.0e-6                               # the largest step that stops it: radians of a rotation or a direction
# A near-duplicate pair: optical axes within near_duplicate_deg (the averaged rotations; the overlap estimate of overlap_deg).
# Verified and averaged, its matches seed no track. 9° = 5 % of this fisheye's ~180° image circle: two frames that overlap by
# 95 % or more add no geometry to a track, and their repeated structure chains wrongly (the 14 mm config's rule).
near_duplicate_deg = 9.0
check_tracks = true                                # after the bundle: observations past 3.035 σ̂ removed and re-solved, until none (cap 10)
execution_provider = "cuda"                        # LoMa's ONNX Runtime provider: "auto" (CUDA where it runs, else the CPU), "cpu" or "cuda"

[domain]                                           # the pixels an observation may use (fit and seam score)
rim_margin_px = 24.0                               # the circle less 24 px: θ ≤ 68.3°
fov_deg = 89.0
plane = 2                                          # the GREEN plane (the quad's two greens, at the quad centre)

[vignetting]
# RADIAL, because a mostly-yaw sweep cannot observe a free 2-D V's vertical tilt: a field exp(α·f_y) is unchanged by a pure
# yaw, so the scene absorbs it. Measured on this rooftop set (2026-11-04): the 2-D fit moved V's maximum ~460 px off-centre
# (down and right) and made V 37–54 % asymmetric at ρ = 600–800 px, the mode ∝ ray_y carrying 4–5× less information than
# ray_x. Use "tensor_product" only for sets with pitch and roll diversity.
model = "radial"
radial_center = "circle_center"                    # "principal_point", "circle_center" or [x, y]
radial_radius = "domain"                           # "domain": the largest distance from the centre to a domain pixel
radial_controls = 16
tensor_box = "domain"
tensor_controls = [16, 16]
compare_models = []
chart_spacing_deg = 1.0                            # L's control spacing on the azimuthal-equidistant chart
penalty_order = 3                                  # Δ³ on L along both chart axes
penalty_weight = 0.01                              # λ, in units of one row of mean I² weight (the self-test's choice)
vignetting_penalty_weight = 1.0e-6                 # the weak Δ² on V's controls, relative to the V block's mean diagonal
# Per-frame exposure gains (g₁ = 1): ON. The exposure is fixed (1/1600 s, f/5.6, ISO 100), but the daylight changed during the
# sweep: measured 2026-11-04 from the radial fit without gains, the frames' median log ratios at 400k directions gave
# g = exp(0, .002, .093, .119, .147, .165, .161, .162, .159, .114) (pairwise consistency rms 0.003; RC's binned fit of record had
# found the same; the fit's own gains of record, 2026-11-04: 1, 0.996, 1.088, 1.118, 1.146, 1.162, 1.156, 1.156, 1.152, 1.098, and
# the seam spread 1.4826·MAD 0.106 → 0.081 with them). Without them V absorbs the differences: 7 % too dark at ρ = 1000 px, residual 1.4826·MAD 0.139 against 0.112.
gain_correction = "channel"                        # "none", "intensity" (one gain per frame, every plane) or "channel" (per frame and colour plane)
observation_noise = "none"                         # "none" (the value's noise alone: the frames' variance, else the read-noise fallback I²) or "position"
                                                   # (the value and the sensor position: the sensor point's σ the registration bundle's
                                                   # core scale, loss width / scale multiple); the weights are the whitening by it
observation_noise_iterations = 1                   # position: its reweight-and-solve cycles after the first solve (2: G_x re-evaluated once more)
solver = "cg"                                    # "cg" (ConjugateGradient on the device) or "cholesky" (SparseCholesky, host)
cg_tolerance = 1.0e-9                              # the CG's relative residual
cg_max_iter = 40000                                # the CG's budget

[seams]                                            # score_seams, before and after the correction
projection = "equirectangular"
deg_per_pixel = 0.1
extent = "coverage"
chunk = 200000

[render]
up = "level"                                       # "level": the vertical orthogonal to every frame's image x axis (a roll-free
                                                   # sweep); "first_frame": the first frame's camera frame
exposure_percentile = 99.5                         # exposure = 1 / this percentile of the CORRECTED cylindrical, applied to all
white_balance = "daylight"                         # for viewing only: LibRaw's daylight multipliers (G = 1); "none" = camera raw
cylindrical_deg_per_pixel = 0.06
cylindrical_max_lat_deg = 55.0                     # the cylindrical's rows are tan φ: capped at ±55° (the fisheye covers ±85°)
equal_area_deg_per_pixel = 0.08
extent = "coverage"
rectilinear_size = [1920, 1080]
rectilinear_hfov_deg = 110.0
