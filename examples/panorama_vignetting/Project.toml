# The example's environment (not a workspace member: it pulls CUDA and LibRaw_jll, which the package does not need, and
# CUDA_Runtime_jll and CUDNN_jll, whose CUDA 12 builds ONNX Runtime's CUDA provider takes for LoMa: lazy artifacts, downloaded
# on the first LoMa session where a CUDA device is visible).
# Instantiate once: julia --project=examples/panorama_vignetting -e 'using Pkg; Pkg.instantiate()'
# Needs the VisualGeometryToolkit 0.9 stack; until it registers, TEMPORARY [sources] below take it from the monorepo snapshot
# beside this repository (~/src/vgtk-bounded-camera-region; Estimation's version field is not bumped yet, so its compat keeps 0.8).
# Never pushed or registered while they are here; remove before release.
[deps]
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
CUDA_Runtime_jll = "76a88914-d11a-5bdc-97e0-2f5a05c973a2"
CUDNN_jll = "62b44479-cb7b-5706-934f-f13b2eb2e645"
GLMakie = "e9467ef8-e4e7-5192-8a1a-b1aee30e663a"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
LibRaw_jll = "d66ac3f3-933a-5ab8-8aa2-9e591b3c5af3"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
PNGFiles = "f57f5aa1-a3ce-4bc8-8ab9-96f992907883"
PanoramaStitching = "5b03ddb8-fc94-4165-83c9-5c94f3367646"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"
VisualGeometryToolkitCore = "96820d6b-1dad-4e77-ad4a-8276f2ec1ce7"
VisualGeometryToolkitEstimation = "9a478df9-9a37-4dc7-9070-58617efe7573"
VisualGeometryToolkitFeatures = "9487290e-790c-4faa-aa87-bc3b5f18b9f7"
VisualGeometryToolkitIO = "0a7ae7e7-e931-45f8-9bba-03d07899cebc"

[sources]
PanoramaStitching = {path = "../.."}
VisualGeometryToolkitCore = {path = "../../../vgtk-bounded-camera-region/VisualGeometryToolkitCore"}
