name: CI

# The package's suite (test/runtests.jl, ReTestItems): the registration, direction sampling and panorama on a synthetic fisheye sweep, the
# rotation bundle, and the tooling gates (Aqua, ExplicitImports, JET). It needs no data and no GPU.
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
      id-token: write   # Codecov upload by OIDC, no token secret
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1'
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # The repo is one workspace: instantiating the test member resolves every member into the one root Manifest and
      # installs what the tests need.
      - name: Instantiate the test environment
        run: julia --project=test -e 'using Pkg; Pkg.instantiate()'
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
