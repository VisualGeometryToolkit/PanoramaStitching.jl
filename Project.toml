[sources]
# TEMPORARY (the migration of the radiometric types; removed before any registration): the Visual Geometry Toolkit packages from the
# branch that retires them and the Visual Radiometry Toolkit packages from their migration branch, until VisualGeometryToolkitCore
# 0.12.0, VisualGeometryToolkitIO 0.11.0 and VisualRadiometryToolkitCore/IO 0.1.0 are in General (a workspace root's url source does
# not reach its members: every project file states them).
